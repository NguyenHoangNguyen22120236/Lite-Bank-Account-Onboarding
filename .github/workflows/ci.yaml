
name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: onboarding_ci
          POSTGRES_DB: onboarding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onboarding -d onboarding_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable CI database; these credentials are not used outside this job.
      TEST_DATABASE_URL: postgres://onboarding:onboarding_ci@localhost:5432/onboarding_test?sslmode=disable
      TEST_TEMPORAL_ADDRESS: localhost:7233
      TEST_TEMPORAL_NAMESPACE: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Check Proto
        run: |
          buf lint
          buf generate
          git diff --exit-code -- gen/

      - name: Check Go formatting
        run: |
          test -z "$(gofmt -l cmd internal gen)"

      - name: Static analysis
        run: go vet ./...

      - name: Validate migration files
        run: go tool goose -env none -dir migrations validate

      - name: Apply test database migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: ${{ env.TEST_DATABASE_URL }}
        run: go tool goose -env none -dir migrations up

      - name: Start test Temporal server
        timeout-minutes: 3
        run: |
          docker run -d --name temporal-ci \
            -p 127.0.0.1:7233:7233 \
            temporalio/temporal:1.10.1 \
            server start-dev --ip 0.0.0.0
          for attempt in {1..30}; do
            if docker exec temporal-ci temporal operator cluster health --address 127.0.0.1:7233; then
              exit 0
            fi
            sleep 2
          done
          echo "Temporal did not become healthy in time"
          docker logs temporal-ci
          exit 1

      - name: Unit, PostgreSQL, and Temporal integration tests with race detector
        run: go test -race -count=1 -v ./...

      - name: Build all packages
        run: go build ./...

      - name: Clean up test Temporal server
        if: always()
        run: |
          if docker container inspect temporal-ci > /dev/null 2>&1; then
            docker logs temporal-ci
            docker rm -f temporal-ci
          fi
