
name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Check Proto
        run: |
          buf lint
          buf generate
          git diff --exit-code -- gen/

      - name: Check Go formatting
        run: |
          test -z "$(gofmt -l cmd internal gen)"

      - name: Static analysis
        run: go vet ./...

      - name: Validate migration files
        run: go tool goose -env none -dir migrations validate

      - name: Unit tests with race detector
        run: go test -race ./...

      - name: Build all packages
        run: go build ./...
